name: Metrics

# Self-hosted stats cards so the README doesn't depend on rate-limited public instances.
# Requires a classic PAT (scopes: read:user, repo) stored as the METRICS_TOKEN secret.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Stats & achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: longurara
          filename: metrics-stats.svg
          output_action: none
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Ho_Chi_Minh
          config_display: regular
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B
          plugin_achievements_limit: 8

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: longurara
          filename: metrics-languages.svg
          output_action: none
          template: classic
          base: ""
          config_timezone: Asia/Ho_Chi_Minh
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css, shaderlab, hlsl
          plugin_languages_colors: github

      - name: Collect renders
        run: |
          mkdir -p dist
          sudo cp /metrics_renders/*.svg dist/
          sudo chown -R "$(id -u):$(id -g)" dist

      - name: Publish to metrics branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: metrics
          build_dir: dist
          commit_message: "chore: update metrics"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
