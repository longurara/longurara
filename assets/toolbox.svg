    <path d="M33 22 L42 27.2 L42 37.8 L33 43 L24 37.8 L24 27.2 Z" fill="none" stroke="#cba6f7" stroke-width="1.6" stroke-linejoin="round" />
    <path d="M24 27.2 L33 32.5 L42 27.2 M33 32.5 L33 43" fill="none" stroke="#cba6f7" stroke-width="1.4" stroke-linejoin="round" />

    <!-- Header Text -->
    <text x="60" y="31" class="title">WebAssembly &amp; 3D Graphics</text>
    <text x="60" y="47" class="subtitle">Native engine ports, shader pipelines &amp; 3D web</text>

