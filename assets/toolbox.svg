<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="100%">
  <defs>
    <style>
      .title {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Ubuntu, sans-serif;
        font-size: 14.5px;
        font-weight: 700;
        fill: #cdd6f4;
      }
      .subtitle {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Ubuntu, sans-serif;
        font-size: 11px;
        font-weight: 400;
        fill: #9399b2;
      }
      .badge-tag {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.4px;
      }
      .pill-primary {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Ubuntu, sans-serif;
        font-size: 11.5px;
        font-weight: 600;
        fill: #cdd6f4;
      }
      .pill-mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
        font-size: 10.3px;
        font-weight: 500;
        fill: #bac2de;
        text-anchor: middle;
      }
      .footer-text {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
        font-size: 10.2px;
        font-weight: 500;
        fill: #a6adc8;
      }
      .footer-hl-mauve { fill: #cba6f7; font-weight: 700; }
      .footer-hl-blue  { fill: #89b4fa; font-weight: 700; }
      .footer-hl-pink  { fill: #f5c2e7; font-weight: 700; }
      .footer-hl-green { fill: #a6e3a1; font-weight: 700; }

      @keyframes pulseGlow {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      @keyframes barShimmer {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 0.4; }
      }
      .pulse-1 { animation: pulseGlow 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .pulse-2 { animation: pulseGlow 2.8s ease-in-out 0.7s infinite; transform-box: fill-box; transform-origin: center; }
      .pulse-3 { animation: pulseGlow 2.8s ease-in-out 1.4s infinite; transform-box: fill-box; transform-origin: center; }
      .pulse-4 { animation: pulseGlow 2.8s ease-in-out 2.1s infinite; transform-box: fill-box; transform-origin: center; }

      .bar-1 { animation: barShimmer 3.6s ease-in-out infinite; }
      .bar-2 { animation: barShimmer 3.6s ease-in-out 0.9s infinite; }
      .bar-3 { animation: barShimmer 3.6s ease-in-out 1.8s infinite; }
      .bar-4 { animation: barShimmer 3.6s ease-in-out 2.7s infinite; }
    </style>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <linearGradient id="gradMauve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cba6f7" />
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#89b4fa" />
      <stop offset="100%" stop-color="#94e2d5" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="gradPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5c2e7" />
      <stop offset="100%" stop-color="#cba6f7" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a6e3a1" />
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- ==================== CARD 1: WEBASSEMBLY & 3D GRAPHICS (Top-Left) ==================== -->
