      <text x="284" y="14.5" class="pill-mono">LZ4 AssetPack</text>

      <rect x="338" y="0" width="60" height="22" rx="5" fill="#161622" stroke="#313244" stroke-width="1" />
      <text x="368" y="14.5" class="pill-mono">WebGL2</text>
    </g>

    <!-- Footer Highlight -->
    <rect x="16" y="134" width="398" height="29" rx="6" fill="#14141f" stroke="#262637" stroke-width="1" />
    <text x="26" y="152.5" class="footer-text">
      <tspan class="footer-hl-mauve">▸</tspan> 3-Worker Wasm Runtime (Client/Master/Caves) • <tspan class="footer-hl-mauve">0ms</tspan> Asset Swaps
    </text>
  </g>

