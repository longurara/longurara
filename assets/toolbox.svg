    <text x="336" y="29.5" class="badge-tag" fill="#cba6f7">WASM / 3D</text>

    <line x1="16" y1="60" x2="414" y2="60" stroke="#313244" stroke-width="1" />

    <!-- Primary Stack Row (Total width = 398px) -->
    <g transform="translate(16, 70)">
      <rect x="0" y="0" width="102" height="24" rx="6" fill="#242438" stroke="#cba6f7" stroke-width="0.9" stroke-opacity="0.5" />
      <circle cx="11" cy="12" r="3" fill="#cba6f7" />
      <text x="19" y="16" class="pill-primary">WebAssembly</text>

      <rect x="108" y="0" width="92" height="24" rx="6" fill="#242438" stroke="#45475a" stroke-width="0.9" />
      <circle cx="119" cy="12" r="3" fill="#89b4fa" />
