      <circle cx="217" cy="12" r="3" fill="#f5c2e7" />
      <text x="225" y="16" class="pill-primary">Unity WebGL2</text>

      <rect x="314" y="0" width="84" height="24" rx="6" fill="#242438" stroke="#45475a" stroke-width="0.9" />
      <circle cx="325" cy="12" r="3" fill="#fab387" />
      <text x="333" y="16" class="pill-primary">Babylon.js</text>
    </g>

    <!-- Low-level APIs Row (Total width = 398px) -->
    <g transform="translate(16, 101)">
      <rect x="0" y="0" width="112" height="22" rx="5" fill="#161622" stroke="#313244" stroke-width="1" />
      <text x="56" y="14.5" class="pill-mono">ShaderLab SM3.5</text>

      <rect x="118" y="0" width="112" height="22" rx="5" fill="#161622" stroke="#313244" stroke-width="1" />
      <text x="174" y="14.5" class="pill-mono">OffscreenCanvas</text>

