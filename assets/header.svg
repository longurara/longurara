    <clipPath id="frame"><rect width="1000" height="230" rx="16"/></clipPath>
  </defs>
  <style>
    .tw { fill: #cdd6f4; opacity: 0.9; animation: tw ease-in-out infinite alternate; }
    @keyframes tw { from { opacity: 0.1; } to { opacity: 0.9; } }
    .wave { animation: drift linear infinite; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-500px); } }
    .moon { animation: bob 6s ease-in-out infinite alternate; }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(5px); } }
    .title { font: 700 44px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill: #cdd6f4; }
    .handle { font: 600 18px Consolas, 'SF Mono', Menlo, monospace; fill: #cba6f7; }
    .sub { font: 400 16px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill: #a6adc8; }
    @media (prefers-reduced-motion: reduce) { .tw, .wave, .moon { animation: none; } }
  </style>
