      <stop offset="0" stop-color="#11111b"/>
      <stop offset="1" stop-color="#1e1e2e"/>
    </linearGradient>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cba6f7"/>
      <stop offset="0.5" stop-color="#f5c2e7"/>
      <stop offset="1" stop-color="#89b4fa"/>
    </linearGradient>
    <radialGradient id="glow">
